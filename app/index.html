<script>
  // opened without trailing slash (…/app) → relative assets would 404
  (function () {
    var p = location.pathname;
    if (!/\/$/.test(p) && !/\.html$/.test(p)) location.replace(p + '/' + location.search + location.hash);
  })();
  // show any startup error instead of a blank screen
  window.__bootErr = function (msg) {
    var el = document.getElementById('boot');
    if (el) el.innerHTML = '<div style="color:#F87171;font-weight:700;margin-bottom:8px">خطا در اجرای اپ</div><div style="font-size:12px;direction:ltr;word-break:break-all;color:#9AA3B2">' + String(msg).replace(/</g, '&lt;') + '</div>';
  };
  window.addEventListener('error', function (e) { window.__bootErr((e.message || 'error') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : '')); });
  window.addEventListener('unhandledrejection', function (e) { window.__bootErr(e.reason && e.reason.message || e.reason); });
</script>
